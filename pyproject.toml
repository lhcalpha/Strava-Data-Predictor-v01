[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-predictor"
version = "0.1.0"
description = "Local web app: race pace prediction, goal rating, and 80/20 training plan from a Strava CSV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "pytest-playwright==0.10.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strava_predictor = ["web/templates/*.html", "web/static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["New Data", ".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["e2e: end-to-end browser tests"]

[tool.coverage.run]
branch = true
source = ["strava_predictor"]
