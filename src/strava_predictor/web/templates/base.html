<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Race pace predictor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">Race pace predictor</a></h1>
    <p class="tagline">Achievable pace, an honest goal rating, and an 80/20 plan from your Strava runs.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Runs locally. Your data never leaves this computer and is not saved to disk.</p>
  </footer>
</body>
</html>
